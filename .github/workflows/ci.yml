name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10/3.11 lock in the fix for a real regression: src/features.py used to
        # rely on CPython's built-in sum() for Neumaier-compensated summation, a
        # behavior only guaranteed from 3.12 on. Under 3.11 that silently drifted
        # ~1e-13 from the JavaScript engine, enough to flip tree splits and swing a
        # predicted probability by tens of points. features.py now does the
        # compensated sum itself, so parity must hold on every supported version.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Descriptor and data tests
        run: python -m pytest tests -q

      - name: Inlined JavaScript is in sync with app/*.js
        run: python tools/sync_app.py --check

      - name: Python / JavaScript numerical parity
        run: python tools/parity_check.py --check
