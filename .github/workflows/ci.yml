name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Descriptor and data tests
        run: python -m pytest tests -q

      - name: Inlined JavaScript is in sync with app/*.js
        run: python tools/sync_app.py --check

      - name: Python / JavaScript numerical parity
        run: python tools/parity_check.py --check
